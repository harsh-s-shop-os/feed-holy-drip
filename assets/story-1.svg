<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<style>
  .blob{transform-origin:50px 50px;animation:drift 34s ease-in-out infinite alternate}
  @keyframes drift{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(7deg) scale(1.05)}100%{transform:rotate(-4.9deg) scale(0.97)}}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
<defs><clipPath id="c"><circle cx="50" cy="50" r="50"/></clipPath>
<filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter></defs>
<g clip-path="url(#c)"><rect width="100" height="100" fill="#21003a"/>
  <g class="blob" filter="url(#b)">
  <circle cx="30" cy="28" r="54" fill="#953fb6"/>
  <circle cx="72" cy="44" r="50" fill="#e462ad"/>
  <circle cx="50" cy="80" r="56" fill="#8d7eff"/>
  </g></g></svg>