<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<style>
  .blob{transform-origin:50px 50px;animation:drift 37s ease-in-out infinite alternate}
  @keyframes drift{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-5deg) scale(1.05)}100%{transform:rotate(4.6deg) scale(0.97)}}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
<defs><clipPath id="c"><circle cx="50" cy="50" r="50"/></clipPath>
<filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter></defs>
<g clip-path="url(#c)"><rect width="100" height="100" fill="#520000"/>
  <g class="blob" filter="url(#b)">
  <circle cx="32" cy="30" r="54" fill="#dc5266"/>
  <circle cx="70" cy="42" r="50" fill="#ff9253"/>
  <circle cx="48" cy="78" r="56" fill="#f674c3"/>
  </g></g></svg>