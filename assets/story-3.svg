<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
<style>
  .blob{transform-origin:50px 50px;animation:drift 44s ease-in-out infinite alternate}
  @keyframes drift{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(6deg) scale(1.05)}100%{transform:rotate(-4.2deg) scale(0.97)}}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}
</style>
<defs><clipPath id="c"><circle cx="50" cy="50" r="50"/></clipPath>
<filter id="b" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter></defs>
<g clip-path="url(#c)"><rect width="100" height="100" fill="#581500"/>
  <g class="blob" filter="url(#b)">
  <circle cx="28" cy="32" r="52" fill="#d78f00"/>
  <circle cx="74" cy="46" r="52" fill="#ccc638"/>
  <circle cx="50" cy="78" r="56" fill="#ffa36a"/>
  </g></g></svg>